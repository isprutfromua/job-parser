name: Job Parser Schedule

on:
  schedule:
    - cron: "0 5-17/2 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: once
        type: choice
        options:
          - once
          - dry-run
      dry_run_pages:
        description: "Pages per source for dry-run"
        required: true
        default: "5"
        type: string

concurrency:
  group: job-parser-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOB_PARSER_DB_PATH: ./data/job_parser.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure DB directory exists
        run: mkdir -p data

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scheduled run (once)
        if: ${{ github.event_name == 'schedule' }}
        run: python -m job_parser.cli once

      - name: Manual run (once)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'once' }}
        run: python -m job_parser.cli once

      - name: Manual run (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'dry-run' }}
        run: python -m job_parser.cli dry-run --pages ${{ inputs.dry_run_pages }}

      - name: Commit database changes
        if: ${{ success() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet data/job_parser.sqlite3; then
            echo "No DB changes to commit"
          else
            git add data/job_parser.sqlite3
            git commit -m "Database update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
